# Run the production container locally, hardened the way it should run anywhere:
#   docker compose up --build        → http://localhost:8080
#   npm run smoke -- http://localhost:8080 --container
services:
  site:
    build:
      context: .
      args:
        # Baked into canonicals and share-image URLs. Match the port below.
        SITE_URL: http://localhost:8080
    image: gwidoropas:local
    ports:
      - "8080:8080"
    read_only: true
    tmpfs:
      - /tmp # nginx's pid file and temp paths
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
