# http{} context tuning for the static site. Copied to /etc/nginx/conf.d/.
# Response headers are NOT set here: they're compiled from vercel.json into
# conf.d/vercel-headers.conf (see scripts/vercel-headers-to-nginx.mjs).

server_tokens off;

# Vercel sends `text/html; charset=utf-8`; nginx omits the charset by default.
charset utf-8;
charset_types text/css text/plain text/xml application/xml application/javascript application/json image/svg+xml;

# The share images and fonts are already compressed; text is what benefits.
gzip on;
gzip_vary on;
gzip_comp_level 6;
gzip_min_length 512;
gzip_proxied any;
gzip_types text/css text/plain text/xml application/xml application/javascript application/json image/svg+xml;

# (keepalive_timeout is already set in the base image's nginx.conf; nginx
# refuses to start if a directive is declared twice in the same context.)
tcp_nopush on;
