# Serves the Astro build (build.format: 'file', so pages are resume.html,
# work/<id>.html …) exactly the way Vercel does with vercel.json's
#   "cleanUrls": true, "trailingSlash": false
# The container is checked against production by scripts/smoke.mjs, so if you
# change routing here, change vercel.json too (or the other way round).
#
# IMPORTANT: no add_header anywhere in this file. Response headers come from
# conf.d/vercel-headers.conf at http level, and nginx silently drops inherited
# add_header directives in any block that declares its own.

server {
    listen 8080 default_server;
    server_name _;
    # A fresh directory, not /usr/share/nginx/html, so the base image's stock
    # index.html and 50x.html can't leak into the site.
    root /srv/site;

    # Relative Location headers (Location: /resume), so redirects stay on the
    # public scheme/host when a TLS-terminating proxy sits in front of us.
    absolute_redirect off;

    # Not-found goes through a named location. Routing it through /404.html
    # would hit the cleanUrls rule below and 308 instead of rendering the page.
    error_page 404 @not_found;
    location @not_found {
        rewrite ^ /404.html break;
    }

    # Liveness/readiness probe for Docker, Kubernetes and Container Apps.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = / {
        try_files /index.html =404;
    }

    # trailingSlash: false   /resume/ → /resume
    location ~ ^(?<no_slash>.+)/$ {
        return 308 $no_slash$is_args$args;
    }

    # cleanUrls: true   /index and /index.html → /, /work/index → /work/
    location ~ ^(?<index_dir>.*)/index(?:\.html)?$ {
        return 308 $index_dir/$is_args$args;
    }

    # cleanUrls: true   /resume.html → /resume
    location ~ ^(?<clean>.+)\.html$ {
        return 308 $clean$is_args$args;
    }

    # Content-hashed build output. Prefix match beats the regexes above.
    location ^~ /_astro/ {
        try_files $uri =404;
    }

    # /resume → resume.html. try_files serves the file directly (no internal
    # redirect), so the .html rule above never sees it.
    location / {
        try_files $uri $uri.html =404;
    }
}
