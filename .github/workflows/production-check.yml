# Runs the contract test (scripts/smoke.mjs) against the live site:
#  • after every successful Vercel production deployment,
#  • once a day, to catch drift nobody deployed (a dashboard setting, a domain change),
#  • on demand.
# The checks are the same ones the container passes in pipeline.yml. A failure
# here means production no longer behaves the way vercel.json says, e.g. the
# noindex header that keeps the unlisted site out of search has gone missing.

name: Production check

on:
  # This project's Vercel integration reports each deployment as a commit
  # status (context "Vercel", "Deployment has completed"), not as a GitHub
  # Deployment, so `status` is the post-deploy signal. GitHub runs status
  # workflows from the default branch's copy of this file.
  status:
  schedule:
    - cron: '23 11 * * *' # daily, 11:23 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    name: Live site honours the contract
    # Only a successful Vercel deployment of a commit on main is production.
    # Preview deployments (PRs, Dependabot) also post statuses, and every
    # deployment posts a "pending" one first; those runs are skipped.
    if: >-
      github.event_name != 'status' ||
      (startsWith(github.event.context, 'Vercel') &&
       github.event.state == 'success' &&
       contains(github.event.branches.*.name, 'main'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SITE_URL: ${{ vars.SITE_URL || 'https://www.gwidoropas.com' }}
    steps:
      # After a deploy, test against the vercel.json of the commit that was
      # just deployed, not whatever main points at by the time this runs.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.sha || github.sha }}
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Contract test
        run: node scripts/smoke.mjs "$SITE_URL"
